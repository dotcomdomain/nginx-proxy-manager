# ------------------------------------------------------------
# {{ incoming_port }} TCP: {{ tcp_forwarding }} UDP: {{ udp_forwarding }}
# ------------------------------------------------------------

{% if enabled %}
{% for binding in port_bindings %}
{% if tcp_forwarding == 1 or tcp_forwarding == true -%}
server {
  listen {{ binding.incoming_port }} reuseport {%- if certificate %} ssl {%- endif %};
  {% unless ipv6 -%} # {%- endunless -%} listen [::]:{{ binding.incoming_port }} reuseport {%- if certificate %} ssl {%- endif %};

  {%- include "_certificates_stream.conf" %}

  proxy_pass {{ forwarding_host }}:{{ binding.forwarding_port }};

  access_log /data/logs/stream-{{ id }}_access.log stream;
  error_log /data/logs/stream-{{ id }}_error.log warn;

  # Custom
  include /data/nginx/custom/server_stream[.]conf;
  include /data/nginx/custom/server_stream_tcp[.]conf;
}
{% endif %}

{% if udp_forwarding == 1 or udp_forwarding == true -%}
server {
  listen {{ binding.incoming_port }} udp reuseport;
  {% unless ipv6 -%} # {%- endunless -%} listen [::]:{{ binding.incoming_port }} udp reuseport;

  proxy_pass {{ forwarding_host }}:{{ binding.forwarding_port }};

  access_log /data/logs/stream-{{ id }}_access.log stream;
  error_log /data/logs/stream-{{ id }}_error.log warn;

  # Custom
  include /data/nginx/custom/server_stream[.]conf;
  include /data/nginx/custom/server_stream_udp[.]conf;
}
{% endif %}
{% endfor %}
{% endif %}
